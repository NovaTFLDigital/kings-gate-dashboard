<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kings Gate Walking Map</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090A0B;
    }

    .map {
      position: fixed;
      inset: 0;
      background: #090A0B;
    }

    .map img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;

      filter:
        grayscale(1)
        invert(0.88)
        brightness(0.42)
        contrast(1.35);
    }
  </style>
</head>

<body>

  <div class="map">
    <img src="kg-map.svg" alt="Kings Gate London Map">
  </div>

</body>
</html>
